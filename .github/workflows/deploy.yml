# Auto-deploy to the InterServer VPS on every push to main.
# The runner rsyncs the checkout to /opt/bondlens and rebuilds the stack,
# so the VPS never needs GitHub access. Required repo secret:
#   VPS_SSH_KEY - private key whose public half is in root@VPS authorized_keys
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # manual fallback when a run gets stuck (GitHub incidents)

# "deploy-v2": renamed from "deploy" to escape a zombie run from the
# 2026-08-06 GitHub Actions incident that held the old group's lock.
concurrency:
  group: deploy-v2
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check backend scripts tests
      - run: uv run basedpyright
      # python -m puts the repo root on sys.path (needed to import `backend`)
      - run: uv run python -m pytest tests/ -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: release_test
          POSTGRES_PASSWORD: release_test_only
          POSTGRES_DB: bondlens_release_test
        ports:
          - 55432:5432
        options: >-
          --memory=768m --cpus=2
          --health-cmd="pg_isready -U release_test -d bondlens_release_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Verify native PostgreSQL transactions and migrations
        env:
          RELEASE_TEST_DATABASE_URL: postgresql://release_test:release_test_only@127.0.0.1:55432/bondlens_release_test
        run: uv run python -m pytest -m e2e tests/test_release_postgres.py -v

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: [test-backend, test-frontend, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 162.35.184.182 >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            --exclude .git --exclude .env --exclude node_modules \
            --exclude .venv --exclude __pycache__ --exclude frontend/dist \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@162.35.184.182:/opt/bondlens/

      - name: Rebuild and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key root@162.35.184.182 \
            'cd /opt/bondlens && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans && docker image prune -f'

      # The api container needs a moment to boot after the rebuild, so poll
      # instead of a fixed sleep — a single early curl was flaking the job.
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -sf -o /dev/null https://bondlens.in/ &&
               curl -s https://bondlens.in/api/auth/me | grep -q 'Sign in required'; then
              echo "Smoke test passed (attempt $i)"
              exit 0
            fi
            echo "Not ready yet (attempt $i) — retrying in 5s"
            sleep 5
          done
          echo "Smoke test failed after 60s"
          exit 1

      - name: Refresh derived analytics and verify deployed calculations
        run: |
          ssh -i ~/.ssh/deploy_key root@162.35.184.182 \
            'cd /opt/bondlens && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api python scripts/verify_deployment.py --wait-migration && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api python scripts/compute_analytics.py && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api python scripts/verify_deployment.py'

      - name: Verify deployed frontend features
        run: python3 scripts/verify_deployment.py --public-only
