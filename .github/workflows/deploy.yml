# Auto-deploy to the InterServer VPS on every push to main.
# The runner rsyncs the checkout to /opt/bondlens and rebuilds the stack,
# so the VPS never needs GitHub access. Required repo secret:
#   VPS_SSH_KEY - private key whose public half is in root@VPS authorized_keys
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check backend scripts tests
      - run: uv run basedpyright
      # python -m puts the repo root on sys.path (needed to import `backend`)
      - run: uv run python -m pytest tests/ -q

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 162.35.184.182 >> ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          rsync -az --delete \
            --exclude .git --exclude .env --exclude node_modules \
            --exclude .venv --exclude __pycache__ --exclude frontend/dist \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@162.35.184.182:/opt/bondlens/

      - name: Rebuild and restart stack
        run: |
          ssh -i ~/.ssh/deploy_key root@162.35.184.182 \
            'cd /opt/bondlens && docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans && docker image prune -f'

      - name: Smoke test
        run: |
          sleep 5
          curl -sf -o /dev/null https://bondlens.duckdns.org/
          curl -s https://bondlens.duckdns.org/api/auth/me | grep -q 'Sign in required'
