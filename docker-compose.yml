# Bounded container logs: docker's json-file driver is unlimited by default.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:18
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_USER: bondlens
      POSTGRES_PASSWORD: bondlens
      POSTGRES_DB: bondlens
    volumes:
      - pgdata:/var/lib/postgresql
      - ~/backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bondlens"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    <<: *logging
    environment:
      DATABASE_URL: postgresql://bondlens:bondlens@db:5432/bondlens
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    <<: *logging
    ports:
      - "3000:80"
    depends_on:
      - api

  jobs:
    build: .
    restart: unless-stopped
    init: true   # tini as PID 1; supercronic's own reaper crashes as PID 1
    <<: *logging
    command: ["sh", "-c",
              "python scripts/migrate.py && python scripts/compute_analytics.py --if-empty && exec supercronic -passthrough-logs /app/crontab"]
    environment:
      DATABASE_URL: postgresql://bondlens:bondlens@db:5432/bondlens
      NTFY_TOPIC: bondlens-sanket-x7k2m9   # subscribe to this in the ntfy app
      BACKUP_DIR: /desktop
    volumes:
      # Weekly pg_dump lands on the (OneDrive-redirected) Windows Desktop,
      # replacing the previous one. Bonus: OneDrive syncs it offsite.
      - "/mnt/c/Users/sanket.patel/OneDrive - FE fundinfo/Desktop:/desktop"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
