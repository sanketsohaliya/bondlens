# Production overrides for the InterServer VPS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from dev:
#   - db/api/web are internal-only; Caddy is the sole public entrypoint (80/443 with auto-TLS).
#   - jobs backups land in ~/backups on the VPS instead of the Windows Desktop mount.
#   - DOMAIN in .env selects the Caddy site address (falls back to plain :80 if unset).

# NOTE: a plain `ports: []` does NOT clear the base file's mappings — compose
# merges lists by appending. The `!override` tag replaces them instead.
services:
  db:
    # Loopback-only: reachable via SSH tunnel (ssh -L 5433:localhost:5432),
    # never from the internet.
    ports: !override
      - "127.0.0.1:5432:5432"

  api:
    ports: !override []

  web:
    ports: !override []

  jobs:
    volumes:
      - ~/backups:/desktop

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      # Caddy advertises HTTP/3 (Alt-Svc h3) on every response; without the
      # UDP mapping browsers that upgrade to QUIC hit a black hole and show
      # intermittent ERR_SSL_* errors.
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
