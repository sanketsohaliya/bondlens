[project]
name = "bondlens"
version = "2.0.0"
description = "Indian corporate-bond data platform: universe tracking, NSDL enrichment, EOD trades, screener API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "requests>=2.34",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",         # starlette TestClient transport
    "ruff>=0.14",
    "basedpyright>=1.39.9",
    "pre-commit>=4.6.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Query()/Depends() defaults are the framework idiom.
"bondlens/app.py" = ["B008"]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["bondlens", "scripts", "tests"]
typeCheckingMode = "standard"
# basedpyright extras dialed back to pyright-compatible behavior
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportCallInDefaultInitializer = false
reportUnannotatedClassAttribute = false

[tool.pytest.ini_options]
testpaths = ["tests"]
