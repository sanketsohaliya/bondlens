[project]
name = "bondlens"
version = "2.0.0"
description = "Indian corporate-bond data platform: universe tracking, NSDL enrichment, EOD trades, screener API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139",
    "uvicorn>=0.51",
    "requests>=2.34",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",         # starlette TestClient transport
    "ruff>=0.14",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
