server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA: unknown paths fall back to the app shell.
    location / {
        try_files $uri /index.html;
    }

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        # Docker's embedded DNS + a variable upstream force re-resolution:
        # a bare proxy_pass caches the api container's IP at startup and
        # serves 502s forever after the container restarts with a new one.
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;   # cold explorer core build takes a few seconds
    }
}
