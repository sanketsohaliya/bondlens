# Quality gates: ruff (lint), basedpyright (types), pytest (fast unit suite).
# All run from the project venv so hook and CLI results always agree.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check backend scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: .venv/bin/basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (unit)
        entry: .venv/bin/python -m pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
      - id: biome
        name: biome (frontend)
        entry: bash -c 'source ~/.nvm/nvm.sh >/dev/null && cd frontend && npx biome check src'
        language: system
        files: ^frontend/src/
        pass_filenames: false
